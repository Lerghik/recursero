<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Principal - Recursero</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Gestión de Usuarios</h1>
      <button id="btn-logout" class="btn-danger">Cerrar Sesión</button>
    </header>

    <p id="user-info"></p>

    <div class="actions">
      <!-- Botón 1: Leer/Consultar -->
      <button id="btn-read">Leer Usuarios (SELECT)</button>
    </div>

    <!-- Sección de Escritura -->
    <div class="form-section">
      <h3>Insertar Nuevo Usuario</h3>
      <input type="text" id="nombre-input" placeholder="Nombre completo" />
      <input type="email" id="email-input" placeholder="Correo electrónico" />
      <!-- Botón 2: Escribir/Insertar -->
      <button id="btn-write">Escribir Usuario (INSERT)</button>
    </div>

    <p id="status-message"></p>

    <!-- Resultados -->
    <h3>Resultados:</h3>
    <ul id="user-list"></ul>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
