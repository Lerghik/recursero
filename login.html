<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Administrador - Recursero</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h2>Ingreso de Administrador</h2>
    
    <!-- Formulario exclusivo para autenticar al administrador -->
    <form id="auth-form">
      <input type="email" id="email" placeholder="Correo de Administrador" required />
      <input type="password" id="password" placeholder="Contraseña" required />
      
      <div class="buttons">
        <button type="submit" id="btn-login">Iniciar Sesión</button>
      </div>
    </form>
    
    <p id="message"></p>
    <a href="index.html">← Volver al panel público</a>
  </div>

  <script type="module" src="src/auth.js"></script>
</body>
</html>
